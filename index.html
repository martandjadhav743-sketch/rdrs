<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDRS Dashboard</title>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            color: #ffffff;
            margin-top: 0;
        }

        p {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>RDRS Dashboard</h1>

    <div class="card">
        <h2>System Status</h2>
        <p id="status-text">Click the button to check RDRS status.</p>
        <button onclick="checkStatus()">Check Status</button>
    </div>

    <div class="card">
        <h2>Alerts</h2>
        <p id="alerts-text">Click the button to load alerts.</p>
        <button onclick="loadAlerts()">Load Alerts</button>
    </div>

    <div class="card">
        <h2>File Events</h2>
        <p id="events-text">Click the button to load file events.</p>
        <button onclick="loadEvents()">Load Events</button>
    </div>

    <div class="card">
        <h2>Reports</h2>
        <p id="reports-text">Click the button to load reports.</p>
        <button onclick="loadReports()">Load Reports</button>
    </div>

    <script>
        async function checkStatus() {
            const statusText = document.getElementById("status-text");

            try {
                const response = await fetch("http://127.0.0.1:8000/status");
                const data = await response.json();

                statusText.textContent =
                    "API: running | Monitoring: " +
                    data.monitoring +
                    " | Simulation mode: " +
                    data.simulation_mode;
            } catch (error) {
                statusText.textContent = "Could not connect to the RDRS API.";
            }
        }

        async function loadAlerts() {
            const alertsText = document.getElementById("alerts-text");

            try {
                const response = await fetch("http://127.0.0.1:8000/alerts");
                const data = await response.json();

                if (data.alerts.length === 0) {
                    alertsText.textContent = "No alerts found.";
                } else {
                    alertsText.textContent = data.alerts.join("\n");
                }
            } catch (error) {
                alertsText.textContent = "Could not load alerts.";
            }
        }

        async function loadEvents() {
            const eventsText = document.getElementById("events-text");

            try {
                const response = await fetch("http://127.0.0.1:8000/events");
                const data = await response.json();

                if (data.events.length === 0) {
                    eventsText.textContent = "No file events found.";
                } else {
                    const eventLines = data.events.map(function(event) {
                        return event.timestamp + " | " + event.event_type + " | " + event.source_path;
                    });

                    eventsText.textContent = eventLines.join("\n");
                }
            } catch (error) {
                eventsText.textContent = "Could not load file events.";
            }
        }

        async function loadReports() {
            const reportsText = document.getElementById("reports-text");

            try {
                const response = await fetch("http://127.0.0.1:8000/reports");
                const data = await response.json();

                reportsText.textContent =
                    "Report period: " + data.report_period + "\n" +
                    "Total events: " + data.total_events + "\n" +
                    "Created events: " + data.created_events + "\n" +
                    "Modified events: " + data.modified_events + "\n" +
                    "Deleted events: " + data.deleted_events + "\n" +
                    "Moved events: " + data.moved_events;
            } catch (error) {
                reportsText.textContent = "Could not load reports.";
            }
        }
    </script>
</body>
</html>
